<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Successful</title>
    <style>
        body {
            background: radial-gradient(circle at center, #0f172a, #020617);
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem;
            text-align: center;
            max-width: 480px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            opacity: 0;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        h1 {
            background: linear-gradient(135deg, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.25rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }
        p {
            color: #94a3b8;
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }
        .success-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 50%;
            color: #c084fc;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes bounceIn {
            from { transform: scale(0.3); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .btn {
            background: linear-gradient(135deg, #0284c7, #7c3aed);
            color: #fff;
            padding: 0.85rem 2.25rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.5);
        }
        .btn:active {
            transform: translateY(0);
        }
        .countdown {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="success-icon">✓</div>
        <h1 id="provider-title">Authentication Successful</h1>
        <p id="success-message">Your inbox connection has been successfully established and secured with the AI Intelligence Hub.</p>
        <button onclick="window.close()" class="btn">Close Window</button>
        <div class="countdown" id="countdown-timer">Closing automatically in 3 seconds...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const provider = urlParams.get('provider') || 'Inbox';
        const formattedProvider = provider === 'google' ? 'Gmail' : (provider === 'microsoft' ? 'Outlook' : provider);
        
        document.getElementById('provider-title').innerText = `${formattedProvider} Connected!`;
        document.getElementById('success-message').innerText = `Your ${formattedProvider} Inbox connection has been successfully connected to the AI Email Intelligence engine.`;

        let timeLeft = 3;
        const countdownTimer = document.getElementById('countdown-timer');
        const interval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(interval);
                window.close();
            } else {
                countdownTimer.innerText = `Closing automatically in ${timeLeft} seconds...`;
            }
        }, 1000);
    </script>
</body>
</html>
